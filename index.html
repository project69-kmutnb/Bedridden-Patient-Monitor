<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vajira Patient Monitor Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; text-align: center; background: #f4f7f9; margin: 0; padding: 0; }
        .header { background: #002D62; color: white; padding: 25px; border-bottom: 5px solid #FFD700; }
        .status-box { font-size: 22px; margin: 20px; padding: 10px 30px; border-radius: 50px; display: inline-block; background: white; border: 3px solid #002D62; font-weight: bold; }
        .settings-panel { margin: 10px auto; padding: 15px; width: 90% ; max-width: 500px; background: white; border-radius: 15px; border: 1px dashed #002D62; }
        table { margin: 20px auto; width: 95%; max-width: 900px; background: white; border-radius: 12px; overflow: hidden; border-collapse: collapse; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        th { background: #002D62; color: white; padding: 15px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 18px; }
        .active-row { background: #E3F2FD; font-weight: bold; color: #0056b3; }
        .footer { margin-top: 30px; font-size: 12px; color: #777; }
    </style>
</head>
<body>
    <div class="header"><h1>🏥 Vajira Patient Monitor</h1></div>
    <div id="st" class="status-box">กำลังโหลด...</div>
    <div><b>⏱️ นอนแล้ว:</b> <span id="dur">0m</span> | <b>⏳ เหลืออีก:</b> <span id="rem">0m</span></div>

    <div class="settings-panel">
        <label>⚙️ รอบส่งข้อมูล:</label>
        <select id="sleepSelect">
            <option value="60000">1 นาที</option>
            <option value="300000" selected>5 นาที</option>
            <option value="600000">10 นาที</option>
        </select>
        <button onclick="saveSleep()">บันทึก</button>
    </div>

    <table>
        <thead><tr><th>ตำแหน่ง</th><th>น้ำหนัก (kg)</th><th>Temp (°C)</th><th>Hum (%)</th></tr></thead>
        <tbody>
            <tr id="tr0"><td>ซ้าย (L)</td><td id="k0">-</td><td id="t0">-</td><td id="h0">-</td></tr>
            <tr id="tr1"><td>กลาง (M)</td><td id="k1">-</td><td id="t1">-</td><td id="h1">-</td></tr>
            <tr id="tr2"><td>ขวา (R)</td><td id="k2">-</td><td id="t2">-</td><td id="h2">-</td></tr>
        </tbody>
    </table>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyiwZ9MXj2o9ndvUV-BPCKz1l3MCYpgiqFGzNcHurOnXwMwIOp_-5ZdhMYyUjM0FGNDiA/exec";

        async function saveSleep() {
            const val = document.getElementById('sleepSelect').value;
            await fetch(`${SCRIPT_URL}?setSleep=${val}`);
            alert("บันทึกแล้ว! บอร์ดจะเปลี่ยนรอบในครั้งถัดไป");
        }

        async function update() {
            try {
                const res = await fetch(SCRIPT_URL);
                const d = await res.json();
                document.getElementById('st').innerText = (d.status==="STANDBY") ? "❌ เตียงว่าง" : "✅ มีคนไข้นอนอยู่";
                document.getElementById('dur').innerText = Math.floor(d.dur/60) + "m";
                document.getElementById('rem').innerText = Math.max(0, Math.floor(d.rem/60)) + "m";
                for(let i=0; i<3; i++) {
                    document.getElementById(`k${i}`).innerText = parseFloat(d.kg[i] || 0).toFixed(1);
                    document.getElementById(`t${i}`).innerText = parseFloat(d.t[i] || 0).toFixed(1);
                    document.getElementById(`h${i}`).innerText = parseFloat(d.h[i] || 0).toFixed(1);
                    document.getElementById(`tr${i}`).className = (d.kg[i] >= 1) ? 'active-row' : '';
                }
            } catch(e) {}
        }
        setInterval(update, 10000); update();
    </script>
</body>
</html>
