<script>
        // 1. นำ URL ที่ได้จากการ Deploy Google Apps Script (New Deployment) มาวางที่นี่
        const SCRIPT_URL = "AKfycbxb004rpzK-OWNnzeDhvZtwBYZllYhR5Da1HbwqXgs2vm2KAadOZAAmpXvd3oS1I42_OA"; 

        async function updateData() {
            try {
                // 2. เปลี่ยนการเรียกข้อมูลจาก IP เครื่องมาเป็นเรียกจาก Google Script แทน
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const d = await response.json();

                // --- ส่วนการแสดงผล (เหมือนเดิม แต่ใช้ข้อมูลจาก d ที่ดึงมาล่าสุด) ---
                document.getElementById('st').innerHTML = d.isWaiting ? '⚠️ น้ำหนักหาย!' : (d.isBed ? '✅ ระบบกำลังตรวจจับผู้ป่วย' : '❌ เตียงว่าง');
                document.getElementById('st').style.borderColor = d.isBed ? '#002D62' : '#d9534f';
                
                // คำนวณเวลา (จัดการวินาทีที่ส่งมาจาก Sheet)
                let durMin = Math.floor(d.dur / 60);
                let durSec = d.dur % 60;
                let remMin = Math.floor(d.rem / 60);
                let remSec = d.rem % 60;

                document.getElementById('dur').innerHTML = durMin + 'm ' + durSec + 's';
                document.getElementById('rem').innerHTML = remMin + 'm ' + remSec + 's';

                for(let i=0; i<3; i++){
                    // ตรวจเช็คข้อมูลก่อนแสดงผล เผื่อกรณีข้อมูลใน Sheet เป็นค่าว่าง
                    let kgVal = d.kg[i] ? parseFloat(d.kg[i]).toFixed(2) : "0.00";
                    let tVal = d.t[i] ? parseFloat(d.t[i]).toFixed(1) : "0.0";
                    let hVal = d.h[i] ? parseFloat(d.h[i]).toFixed(1) : "0.0";

                    document.getElementById(`k${i}`).innerHTML = kgVal;
                    document.getElementById(`t${i}`).innerHTML = tVal;
                    document.getElementById(`h${i}`).innerHTML = hVal;
                    
                    // เปลี่ยนแถวเป็นสีฟ้าหากมีน้ำหนักกดทับเกิน 1kg
                    document.getElementById(`tr${i}`).className = parseFloat(kgVal) >= 1.0 ? 'active-row' : '';
                }
            } catch (err) {
                document.getElementById('st').innerHTML = "❌ ไม่สามารถดึงข้อมูลจาก Cloud ได้";
                console.error("Fetch error:", err);
            }
        }

        // ตั้งเวลาดึงข้อมูลทุก 10 วินาที (ให้สัมพันธ์กับที่ ESP32 ส่งเข้า Sheet)
        setInterval(updateData, 10000); 
        updateData(); 
    </script>
